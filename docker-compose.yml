version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: social_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://postgres:sync@db:5432/social_db
      # Backblaze B2 credentials are read at runtime from environment variables.
      # Define these in a local .env file (NOT committed) or your deployment environment.
      - B2_KEY_ID=${B2_KEY_ID}
      - B2_APP_KEY=${B2_APP_KEY}
      - B2_BUCKET_ID=${B2_BUCKET_ID}
    ports:
      - "3000:3000"
    depends_on:
      - db
    working_dir: /app
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Preserve node_modules installed in the container so deps aren't masked by bind mount
      - frontend_node_modules:/app/node_modules

  vidbackend:
    build: ./vidbackend
    ports:
      - "8000:8000"
    depends_on:
      - db
    working_dir: /app
    volumes:
      - ./vidbackend:/app

  websocket:
    build: ./socketio
    environment:
      - PGUSER=postgres
      - PGPASSWORD=sync
      - PGHOST=db
      - PGDATABASE=social_db
      - PGPORT=5432
    ports:
      - "4000:4000"
    depends_on:
      - db
    working_dir: /app
    volumes:
      - ./socketio:/app
      # Preserve node_modules installed during image build so dependencies (e.g. ws) remain available
      - websocket_node_modules:/app/node_modules

volumes:
  postgres_data:
  websocket_node_modules:
  frontend_node_modules:
